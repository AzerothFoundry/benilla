[package]
name = "realm-companion"
version = "0.4.8"
edition.workspace = true
license.workspace = true

[dependencies]
avian3d = "0.6"
bevy.workspace = true
benilla-app = { path = "../benilla-app", default-features = false, features = ["companion"] }
benilla-world = { path = "../benilla-world", default-features = false }
bevy_egui = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
url = "2"

benilla-formats = {path="../benilla-formats",default-features=false}
benilla-blp = {path="../benilla-blp"}
image = {version="0.25",default-features=false,features=["png"]}
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = {version="0.23.1",default-features=false}
objc2 = "0.5"
objc2-app-kit = {version="0.2",features=["NSApplication","NSWindow","NSImage"]}
objc2-foundation = {version="0.2",features=["NSArray","NSTimer","NSDate","block2"]}

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.5"
